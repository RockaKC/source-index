<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#f7f8f6; --hairline:#e6e8e4; --line:#7e8581;
  --ink:#14181a; --muted:#6b726e; --accent:#2f6b4f; --accent-hover:#255840;
  --tint:#e7f0ea; --on-accent:#ffffff;
  --serif:"Palatino Linotype",Palatino,"Book Antiqua","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s6:48px; --s8:64px;
  --fade:150ms ease-out;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/26px var(--sans);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:var(--s2) var(--s2) var(--s6)}
header{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding-bottom:var(--s2);border-bottom:1px solid var(--hairline)}
.wordmark{font:600 20px/28px var(--serif);text-decoration:none}
.nav{font:500 15px/20px var(--sans);color:var(--muted);text-decoration:none;transition:color var(--fade)}
.nav:hover{color:var(--ink)}
.wordmark .sub{font:500 14px/20px var(--sans);color:var(--muted);margin-left:6px}
.cap a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;transition:color var(--fade)}
.cap a:hover{color:var(--accent)}
.piece .btn{margin-top:var(--s1)}
.ok{margin-left:var(--s1);color:var(--accent)}
.base{word-break:break-all}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,9vw,44px);line-height:1.15;letter-spacing:-.01em;margin-top:var(--s6)}
h2{font-size:26px;line-height:34px;letter-spacing:-.005em;margin-top:var(--s6)}
h3{font-size:22px;line-height:30px}
.lede{margin:var(--s2) 0 0;max-width:56ch;color:var(--muted)}
h2 + .lede{margin-top:var(--s1)}
.back{display:inline-block;margin-top:var(--s3);font:500 15px/20px var(--sans);color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.back + h1{margin-top:var(--s2)}
.cap{margin:0;font:400 13px/18px var(--sans);color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
form.search{display:flex;gap:var(--s1);margin-top:var(--s3)}
input[type=search]{flex:1;min-width:0;height:48px;padding:0 var(--s2);border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:400 16px/24px var(--sans)}
input[type=search]::placeholder{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 var(--s2);border-radius:8px;font:500 15px/20px var(--sans);text-decoration:none;cursor:pointer;white-space:nowrap;transition:background-color var(--fade)}
.btn.primary{height:48px;padding:0 var(--s3);background:var(--accent);color:var(--on-accent);border:0}
.btn.primary:hover{background:var(--accent-hover)}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.secondary:hover{background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1);margin:var(--s2) 0 0;padding:0;list-style:none}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;background:var(--surface);border:1px solid var(--hairline);border-radius:8px;font:500 14px/20px var(--sans);text-decoration:none;transition:background-color var(--fade)}
.chip:hover{background:var(--tint)}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:var(--s3)}
.card + .card{margin-top:var(--s2)}
.list{list-style:none;margin:0;padding:0}
.list > li + li{border-top:1px solid var(--hairline)}
.q{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s2) 0;text-decoration:none;min-height:56px}
.q span{font:600 19px/26px var(--serif);text-wrap:balance;transition:color var(--fade)}
.q:hover span{color:var(--accent)}
.q i{font-style:normal;color:var(--muted);font:500 15px/20px var(--sans)}
.piece{padding:var(--s2) 0}
.piece .t{font:600 18px/26px var(--serif);text-wrap:balance;margin:2px 0}
.piece .t a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;transition:color var(--fade)}
.piece .t a:hover{color:var(--accent)}
.feature h3{margin:var(--s1) 0 var(--s1)}
.feature h3 a{text-decoration:none}
.feature .btn{margin-top:var(--s2)}
.verse{margin:0;padding:var(--s3);background:var(--surface);border:1px solid var(--hairline);border-radius:12px}
.verse p{margin:0;font:400 italic 20px/32px var(--serif)}
.verse p + p{margin-top:2px}
.verse .cap{margin-top:var(--s2)}
.tabs{display:flex;gap:var(--s1);margin-top:var(--s3)}
.tab{height:40px;padding:0 var(--s2);border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:500 15px/20px var(--sans);cursor:pointer;transition:background-color var(--fade)}
.tab:hover{background:var(--surface)}
.tab[aria-selected=true]{background:var(--tint);border-color:var(--tint);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s1);margin:var(--s2) 0 0;padding:0;list-style:none}
.bk{display:block;height:100%;padding:12px var(--s2);background:var(--surface);border:1px solid var(--hairline);border-radius:12px;text-decoration:none;transition:background-color var(--fade)}
.bk:hover{background:var(--tint)}
.bk .n{display:block;font:500 15px/20px var(--sans)}
.bk .m{display:block;margin-top:2px;font:400 12px/16px var(--sans);color:var(--muted)}
.grp{margin-top:var(--s3)}
.grp h3{font-size:18px;line-height:26px}
.grp .chips{margin-top:var(--s1)}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s2);padding:12px 0;flex-wrap:wrap}
.row .r{font:600 18px/26px var(--serif)}
.cta{margin-top:var(--s3)}
footer{margin-top:var(--s8);padding-top:var(--s3);border-top:1px solid var(--hairline)}
footer p{margin:0;max-width:56ch;color:var(--muted)}
footer .btn{margin-top:var(--s2)}
footer .cap{margin-top:var(--s3)}
.fadein{animation:fade var(--fade)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:720px){
  .wrap{padding:var(--s4) var(--s3) var(--s8)}
  .grid{grid-template-columns:repeat(3,1fr);gap:var(--s2)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  for (const [b,ch,v] of (REFS[pid] || [])) for (const p of D.verses[b][ch][v]) if (+p !== +pid) score[p] = (score[p] || 0) + 1;
  return Object.keys(score).sort((a,c) => score[c]-score[a] || P[c][5]-P[a][5]).slice(0, n).map(p => [+p, score[p]]);
}
const srcLink = pid => hasRefs(pid) ? ` \u00b7 <a href="#/essay/${pid}">Sources</a>` : '';

// ---------- piece pieces ----------
const meta = pid => `${PLAT[P[pid][2]] || esc(P[pid][2])}, ${fmtDate(P[pid][3])}`;
const seriesCap = pid => P[pid][4] ? `<p class="cap">${esc(P[pid][4])}</p>` : '';
const link = pid => `href="${esc(P[pid][1])}" target="_blank" rel="noopener"`;
function feature(pid) {
  return `<div class="card feature">${seriesCap(pid)}
    <h3><a ${link(pid)}>${esc(P[pid][0])}</a></h3>
    <p class="cap">${meta(pid)}${srcLink(pid)}</p>
    <a class="btn primary" ${link(pid)} aria-label="Read the essay: ${esc(P[pid][0])}">Read the essay</a></div>`;
}
function pieceList(ids) {
  return `<div class="card"><ul class="list">${ids.map(pid => `<li class="piece">${seriesCap(pid)}
    <div class="t"><a ${link(pid)}>${esc(P[pid][0])}</a></div><p class="cap">${meta(pid)}${srcLink(pid)}</p></li>`).join('')}</ul></div>`;
}
const rank = ids => ids.slice().sort((a,b) => {
  const ca = D.conv.indexOf(+a), cb = D.conv.indexOf(+b);
  if ((ca > -1) !== (cb > -1)) return ca > -1 ? -1 : 1;
  if (ca > -1 && cb > -1) return ca - cb;
  return P[b][5] - P[a][5];
});
function keepReading(exclude = [], n = 3) {
  const ids = D.conv.filter(p => !exclude.includes(p)).slice(0, n);
  return ids.length ? `<h2>Keep reading</h2>${pieceList(ids)}` : '';
}

// ---------- reads ----------
function rangeLabel(r) {
  const [, , b, cs, vs, ce, ve] = r, n = bname(b);
  if (ve === 999) return cs === ce ? `${n} ${cs}` : `${n} ${cs} to ${ce}`;
  if (cs === ce) return vs === ve ? `${n} ${cs}:${vs}` : `${n} ${cs}:${vs}\u2013${ve}`;
  return `${n} ${cs}:${vs}\u2013${ce}:${ve}`;
}
function readList(rs) {
  rs = rs.slice().sort((a,b) => a[3]-b[3] || a[4]-b[4] || a[0]-b[0] || a[1]-b[1]);
  return `<div class="card"><ul class="list">${rs.map(r => {
    const g = D.guides[r[0]];
    const act = g[1] ? `<a class="btn secondary" href="${esc(g[1])}" target="_blank" rel="noopener" aria-label="Open the guide: ${esc(g[0])}">Open the guide</a>` : `<span class="cap">Returns next winter</span>`;
    return `<li class="row"><div><div class="r">${esc(rangeLabel(r))}</div><p class="cap">${esc(g[0])}, day ${r[1]}, ${TRANS[r[7]] || esc(r[7])}</p></div>${act}</li>`;
  }).join('')}</ul></div>`;
}

// ---------- search ----------
const aliases = {};
const addAlias = (k, b) => { k = k.toLowerCase().replace(/[^a-z0-9]/g,''); if (k && !aliases[k]) aliases[k] = +b; };
for (const b in D.books) addAlias(D.books[b][0], b);
const EXTRA = {Psalms:['psalm','ps'],Genesis:['gen'],Exodus:['exod','ex'],Leviticus:['lev'],Numbers:['num'],Deuteronomy:['deut'],Joshua:['josh'],Judges:['judg'],'1 Samuel':['1sam'],'2 Samuel':['2sam'],'1 Kings':['1kgs','1ki'],'2 Kings':['2kgs','2ki'],'1 Chronicles':['1chr'],'2 Chronicles':['2chr'],Nehemiah:['neh'],Esther:['esth'],Proverbs:['prov'],Ecclesiastes:['eccl'],'Song of Songs':['song','songofsolomon'],Isaiah:['isa'],Jeremiah:['jer'],Lamentations:['lam'],Ezekiel:['ezek'],Daniel:['dan'],Hosea:['hos'],Micah:['mic'],Nahum:['nah'],Habakkuk:['hab'],Zephaniah:['zeph'],Zechariah:['zech'],Malachi:['mal'],Matthew:['matt','mt'],Mark:['mk'],Luke:['lk'],John:['jn'],Romans:['rom'],'1 Corinthians':['1cor'],'2 Corinthians':['2cor'],Galatians:['gal'],Ephesians:['eph'],Philippians:['phil'],Colossians:['col'],'1 Thessalonians':['1thess'],'2 Thessalonians':['2thess'],'1 Timothy':['1tim'],'2 Timothy':['2tim'],Hebrews:['heb'],'1 Peter':['1pet'],'2 Peter':['2pet'],'1 John':['1jn'],James:['jas'],Revelation:['rev'],Enoch:['1enoch'],Jubilees:['jub']};
for (const b in D.books) (EXTRA[bname(b)]||[]).forEach(a => addAlias(a, b));
function findBook(raw) {
  const k = raw.toLowerCase().replace(/[^a-z0-9]/g,'');
  if (!k) return null; if (aliases[k]) return aliases[k]; if (k.length < 3) return null;
  const hits = [...new Set(Object.keys(aliases).filter(a => a.startsWith(k)).map(a => aliases[a]))];
  return hits.length === 1 ? hits[0] : null;
}
function parseRef(q) {
  const m = q.trim().toLowerCase().replace(/\./g,'').match(/^((?:[123]\s*)?[a-z][a-z\s]*?)\s*(?:(\d+)(?:\s*[:]\s*(\d+))?)?$/);
  if (!m) return null; const b = findBook(m[1]); if (!b) return null;
  return {b, ch: m[2] ? +m[2] : null, v: m[3] ? +m[3] : null};
}
function go(q) {
  q = q.trim(); if (!q) return;
  const r = parseRef(q);
  if (r) {
    if (r.ch && r.v) location.hash = `#/verse/${r.b}/${r.ch}/${r.v}`;
    else location.hash = `#/book/${D.bookEntry[r.b]}`;
  } else location.hash = '#/search/' + encodeURIComponent(q);
}

// ---------- derived ----------
function piecesForBook(bs) {
  const s = new Set();
  bs.forEach(b => { const v = D.verses[b] || {}; for (const ch in v) for (const x in v[ch]) v[ch][x].forEach(p => s.add(+p)); });
  return [...s];
}
function topVerses() {
  const all = [];
  for (const b in D.verses) for (const ch in D.verses[b]) for (const v in D.verses[b][ch]) all.push([+b, +ch, +v, D.verses[b][ch][v].length]);
  all.sort((a,c) => c[3]-a[3] || a[0]-c[0] || a[1]-c[1] || a[2]-c[2]);
  const per = {}, out = [];
  for (const x of all) { per[x[0]] = (per[x[0]]||0) + 1; if (per[x[0]] > 1) continue; out.push(x); if (out.length === 4) break; }
  return out;
}
function shelf(es) {
  return `<ul class="grid">${es.map(e => {
    const n = piecesForBook(e.books).length;
    return `<li><a class="bk" href="#/book/${e.id}"><span class="n">${esc(e.name)}</span>${n ? `<span class="m">${plural(n,'essay')}</span>` : ''}</a></li>`;
  }).join('')}</ul>`;
}

// ---------- views ----------
function viewHome() {
  const chips = topVerses().map(([b,ch,v]) => `<li><a class="chip" href="#/verse/${b}/${ch}/${v}">${esc(bname(b))} ${ch}:${v}</a></li>`).join('');
  const qs = D.paths.map(p => `<li><a class="q" href="#/path/${p.id}"><span>${esc(p.q)}</span><i aria-hidden="true">Read</i></a></li>`).join('');
  const extras = D.entries.filter(e => e.extra);
  return `
  <h1>Find any verse in the 81-book canon.</h1>
  <p class="lede">Search a verse to see the essays that quote it, or start with a question.</p>
  <form class="search" role="search" id="sf">
    <label class="sr" for="q">Search by verse or title</label>
    <input id="q" type="search" placeholder="Genesis 6:4 or a title" autocomplete="off" enterkeyhint="search">
    <button class="btn primary" type="submit">Search</button>
  </form>
  <ul class="chips" aria-label="Popular verses">${chips}</ul>

  <h2>Start with a question</h2>
  <div class="card" style="margin-top:16px;padding-top:8px;padding-bottom:8px"><ul class="list">${qs}</ul></div>

  <h2>Books outside most Bibles</h2>
  <p class="lede">${D.entries.length ? extras.length : ''} of the 81 are not in a Protestant Bible.</p>
  ${shelf(extras)}
  <p style="margin-top:16px"><a class="btn secondary" href="#/books">Browse all 81 books</a></p>

  ${keepReading([], 3)}`;
}
function viewBooks(t) {
  t = t || 'OT';
  const es = D.entries.filter(e => e.t === t);
  return `
  <a class="back" href="#/">Find a verse</a>
  <h1>The 81 books</h1>
  <p class="lede">As the Ethiopian Orthodox Church lists them: 46 in the Old Testament and 35 in the New.</p>
  <div class="tabs" role="tablist" aria-label="Testament">
    <button class="tab" role="tab" aria-selected="${t==='OT'}" data-t="OT">Old Testament</button>
    <button class="tab" role="tab" aria-selected="${t==='NT'}" data-t="NT">New Testament</button>
  </div>
  <div id="shelf">${shelf(es)}</div>`;
}
function viewPath(id) {
  const p = D.paths.find(x => x.id === id); if (!p) return viewMissing();
  const [first, ...rest] = p.p;
  return `
  <a class="back" href="#/">Find a verse</a>
  <h1>${esc(p.q)}</h1>
  <p class="lede">${esc(p.intro)}</p>
  <h2>Start here</h2>
  <div style="margin-top:16px">${feature(first)}</div>
  <h2>Then read</h2>
  ${pieceList(rest)}
  ${keepReading(p.p, 2)}`;
}
function viewBook(eid) {
  const e = entryOf(eid); if (!e) return viewMissing();
  const ids = rank(piecesForBook(e.books));
  const reads = D.reads.filter(r => e.books.includes(r[2]));
  const same = D.entries.filter(x => x.t === e.t);
  const pos = `Number ${same.findIndex(x => x.id === e.id) + 1} of ${same.length} in the ${e.t === 'OT' ? 'Old' : 'New'} Testament list.`;
  const groups = e.books.map(b => {
    const vs = D.verses[b] || {}, chs = Object.keys(vs).map(Number).sort((a,c) => a-c);
    return chs.map(ch => `<div class="grp"><h3>${esc(bname(b))} ${ch}</h3><ul class="chips">${
      Object.keys(vs[ch]).map(Number).sort((a,c) => a-c).map(v =>
        `<li><a class="chip" href="#/verse/${b}/${ch}/${v}" aria-label="${esc(bname(b))} ${ch}:${v}">${ch}:${v}</a></li>`).join('')}</ul></div>`).join('');
  }).join('');
  let body;
  if (ids.length) {
    body = `<h2>Start here</h2><div style="margin-top:16px">${feature(ids[0])}</div>
      ${ids.length > 1 ? `<h2>More on ${esc(e.name)}</h2>${pieceList(ids.slice(1, 6))}` : ''}
      <h2>Verses we have written on</h2>${groups}`;
  } else {
    body = `<h2>Not in the index yet</h2>
      <div class="card" style="margin-top:16px"><p style="margin:0">No essay in this index covers ${esc(e.name)} yet. The free reference guide covers every book in the canon.</p>
      <p style="margin:16px 0 0"><a class="btn secondary" href="${esc(D.guide[1])}" target="_blank" rel="noopener">Open the reference guide</a></p></div>`;
  }
  return `
  <a class="back" href="#/books">All books</a>
  <h1>${esc(e.name)}</h1>
  <p class="lede">${e.extra ? 'Not in a Protestant Bible. ' : ''}${pos}</p>
  ${body}
  ${reads.length ? `<h2>Read in season</h2>${readList(reads)}` : ''}
  ${keepReading(ids.slice(0,1), 2)}`;
}
function viewVerse(b, ch, v) {
  if (!D.books[b]) return viewMissing();
  const ids = rank(((D.verses[b] || {})[ch] || {})[v] || []);
  const ref = ch * 1000 + v;
  const reads = D.reads.filter(r => r[2] === b && r[3]*1000 + r[4] <= ref && ref <= r[5]*1000 + r[6]);
  const key = `${b}:${ch}:${v}`, tx = D.text[key], nt = D.notes && D.notes[key];
  const label = `${bname(b)} ${ch}:${v}`;
  const sib = Object.keys(((D.verses[b] || {})[ch]) || {}).map(Number).sort((a,c) => a-c).filter(x => x !== v);
  const text = tx ? `<figure class="verse" style="margin:24px 0 0">${tx[1].map(l => `<p>${esc(l)}</p>`).join('')}<p class="cap" style="font:400 13px/18px var(--sans)">${esc(label)}, ${esc(tx[0])}</p></figure>` : '';
  const note = nt ? `<p class="lede" style="margin-top:16px">${esc(nt.text)}${nt.to ? ` <a href="#/verse/${nt.to.join('/')}" style="color:var(--accent)">${esc(nt.label)}</a>` : ''}</p>` : '';
  const main = ids.length
    ? `<h2>Start here</h2><div style="margin-top:16px">${feature(ids[0])}</div>
       ${ids.length > 1 ? `<h2>Also quotes this verse</h2>${pieceList(ids.slice(1))}` : ''}`
    : `<h2>Not in the index yet</h2><div class="card" style="margin-top:16px"><p style="margin:0">No essay in this index quotes this verse yet.</p></div>`;
  return `
  <a class="back" href="#/book/${D.bookEntry[b]}">${esc(bname(b))}</a>
  <h1>${esc(label)}</h1>
  ${text}${note}
  ${main}
  ${reads.length ? `<h2>Read in season</h2>${readList(reads)}` : ''}
  ${keepReading(ids.slice(0,3), 2)}
  ${sib.length ? `<h2>More from ${esc(bname(b))} ${ch}</h2><ul class="chips">${sib.map(x => `<li><a class="chip" href="#/verse/${b}/${ch}/${x}" aria-label="${esc(bname(b))} ${ch}:${x}">${ch}:${x}</a></li>`).join('')}</ul>` : ''}`;
}
function viewSearch(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = Object.keys(P).filter(pid => P[pid] && words.every(w => P[pid][0].toLowerCase().includes(w))).sort((a,b) => P[b][5]-P[a][5]);
  return `
  <a class="back" href="#/">Find a verse</a>
  <h1>Results for \u201c${esc(q)}\u201d</h1>
  <p class="lede">${hits.length ? plural(hits.length,'essay') + ' with that in the title.' : 'Nothing matched. Try a verse such as Genesis 6:4, or a shorter title.'}</p>
  ${hits.length ? `<div style="margin-top:24px">${pieceList(hits.slice(0,12))}</div>` : ''}`;
}
function viewEssay(pid) {
  if (!P[pid]) return viewMissing();
  const [title, url, plat, date] = P[pid];
  if (!hasRefs(pid)) return `<a class="back" href="#/">Find a verse</a><h1>${esc(title)}</h1>
    <p class="lede">No Scripture references from this essay are in the index yet.</p>
    <p style="margin-top:24px"><a class="btn primary" ${link(pid)}>Read the essay</a></p>`;
  const refs = REFS[pid], books = [...new Set(refs.map(r => r[0]))].sort((a,c) => a-c);
  const groups = books.map(b => `<div class="grp"><h3>${esc(bname(b))}</h3><ul class="chips">${
    spans(refs.filter(r => r[0] === b)).map(s => `<li><a class="chip" href="#/verse/${s.b}/${s.ch}/${s.vs}" aria-label="${esc(spanLabel(s))}">${esc(s.ch + ':' + s.vs + (s.ve > s.vs ? '\u2013' + s.ve : ''))}</a></li>`).join('')}</ul></div>`).join('');
  const withText = refs.filter(([b,ch,v]) => D.text[`${b}:${ch}:${v}`]).sort((a,c) => a[0]-c[0] || a[1]-c[1] || a[2]-c[2]);
  const texts = withText.length ? `<h2>The verses</h2>${withText.map(([b,ch,v]) => { const tx = D.text[`${b}:${ch}:${v}`];
    return `<figure class="verse" style="margin:16px 0 0">${tx[1].map(l => `<p>${esc(l)}</p>`).join('')}<p class="cap" style="font:400 13px/18px var(--sans)">${esc(bname(b))} ${ch}:${v}, ${esc(tx[0])}</p></figure>`; }).join('')}` : '';
  const rel = related(pid, 3);
  const relHtml = rel.length ? `<h2>Essays that cite the same verses</h2><div class="card"><ul class="list">${rel.map(([p,n]) => `<li class="piece">${seriesCap(p)}
    <div class="t"><a ${link(p)}>${esc(P[p][0])}</a></div><p class="cap">${plural(n,'shared verse')} \u00b7 ${meta(p)}${srcLink(p)}</p></li>`).join('')}</ul></div>` : '';
  return `
  <a class="back" href="#/">Find a verse</a>
  <h1>${esc(title)}</h1>
  <p class="lede">${meta(pid)}. Cites ${plural(refs.length,'verse')} across ${plural(books.length,'book')}.</p>
  <p style="margin-top:24px"><a class="btn primary" ${link(pid)} aria-label="Read the essay: ${esc(title)}">Read the essay</a></p>
  <h2>Scripture cited</h2>${groups}
  ${texts}
  ${relHtml}`;
}
function ctaFor(pid) {
  const url = `${BASE}#/essay/${pid}`;
  return {
    html: `<p><strong>Sources for this essay.</strong> Every verse cited here, and every other Kingdom Code essay that quotes it, is in the <a href="${url}">Source Index</a>.</p>`,
    text: `Sources for this essay. Every verse cited here, and every other Kingdom Code essay that quotes it, is in the Source Index: ${url}`
  };
}
function viewCta(q) {
  q = (q || '').toLowerCase().trim();
  const ids = Object.keys(P).filter(pid => P[pid] && hasRefs(pid) && (!q || P[pid][0].toLowerCase().includes(q)))
    .sort((a,b) => P[b][3].localeCompare(P[a][3]));
  return `
  <a class="back" href="#/">Find a verse</a>
  <h1>Essay call-to-action</h1>
  <p class="lede">Add this to the end of an essay. It sends readers to the sources behind it.</p>
  <div class="card" style="margin-top:24px"><p class="cap">Links point to</p><p class="base" style="margin:4px 0 0">${esc(BASE)}</p></div>
  <form class="search" role="search" id="cf">
    <label class="sr" for="cq">Find an essay</label>
    <input id="cq" type="search" value="${esc(q)}" placeholder="Part of an essay title" autocomplete="off" enterkeyhint="search">
    <button class="btn secondary" type="submit" style="height:48px">Find</button>
  </form>
  <div class="card" style="margin-top:16px"><ul class="list">${ids.slice(0, 40).map(pid => `<li class="piece">
    <div class="t">${esc(P[pid][0])}</div><p class="cap">${meta(pid)}</p>
    <button class="btn secondary" data-cta="${pid}" aria-label="Copy the call-to-action for: ${esc(P[pid][0])}">Copy CTA</button><span class="cap ok" data-st="${pid}" role="status"></span></li>`).join('')}</ul></div>
  ${ids.length > 40 ? `<p class="cap" style="margin-top:12px">Showing the 40 newest of ${ids.length}. Search to narrow.</p>` : ''}`;
}
async function copyRich(html, text) {
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type:'text/html'}), 'text/plain': new Blob([text], {type:'text/plain'})})]);
      return true;
    }
  } catch (e) {}
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { return false; }
}
function viewMissing() { return `<a class="back" href="#/">Find a verse</a><h1>Not found</h1><p class="lede">That page is not in the index yet.</p>`; }

// ---------- router ----------
function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/');
  let html;
  if (!p[0]) html = viewHome();
  else if (p[0] === 'books') html = viewBooks('OT');
  else if (p[0] === 'path') html = viewPath(p[1]);
  else if (p[0] === 'essay') html = viewEssay(+p[1]);
  else if (p[0] === 'cta') html = viewCta(decodeURIComponent(p.slice(1).join('/')));
  else if (p[0] === 'book') html = viewBook(+p[1]);
  else if (p[0] === 'verse') html = viewVerse(+p[1], +p[2], +p[3]);
  else if (p[0] === 'search') html = viewSearch(decodeURIComponent(p.slice(1).join('/')));
  else html = viewMissing();
  app.innerHTML = `<div class="fadein">${html}</div>`;
  const sf = document.getElementById('sf');
  if (sf) sf.addEventListener('submit', e => { e.preventDefault(); go(document.getElementById('q').value); });
  const cf = document.getElementById('cf');
  if (cf) cf.addEventListener('submit', e => { e.preventDefault(); location.hash = '#/cta/' + encodeURIComponent(document.getElementById('cq').value.trim()); });
  document.querySelectorAll('[data-cta]').forEach(b => b.addEventListener('click', async () => {
    const c = ctaFor(+b.dataset.cta), ok = await copyRich(c.html, c.text), st = document.querySelector(`[data-st="${b.dataset.cta}"]`);
    if (st) st.textContent = ok ? 'Copied' : 'Copy was blocked. Press and hold the text instead.';
  }));
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.getElementById('shelf').innerHTML = shelf(D.entries.filter(e => e.t === t.dataset.t));
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
  }));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
